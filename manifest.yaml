manifest_version: 1

persistence: none

app_author_name: "djabiffen"

app:
  id: hack.dafydd_public
  name: App Finder
  version: 0.1.0
  # Never the word "by": the badge is parsed from
  # "[via <name> <version> by <author name>]" and splits on the first one.
  summary: >-
    Says which apps can do a job you describe, and lists every app available
    to install, with who made each. It matches your words against a list of
    apps built into it, so nothing is sent anywhere.

agent_types:
  - personal

outcomes:
  - id: apps.find
    summary: Name the apps that can do a job the user describes
    example_phrases:
      - is there an app that can
      - which app can i use to
      - find me an app that
      - do you have an app for
      - looking for an app that
      - is there an app to help me with
      - which app works out
    inputs:
      - name: task
        type: string
        required: false
        description: >-
          The job the user wants an app to do, in their own words, for example
          "convert pounds to euros" or "split a restaurant bill". Leave out
          the words that ask about apps ("is there an app that"). If the
          message does not say what the job is, return an empty string rather
          than guessing.
    output:
      - name: matched
        type: integer
        description: How many apps look able to do the job.
      - name: apps
        type: array
        item_type: string
        description: >-
          Up to three matching apps, best first, each as
          "<name>, from <author>: <what it does>".
      - name: best_match
        type: string
        required: false
        description: The name of the one app that fits clearly better than the rest, when there is one.
      - name: catalogue_size
        type: integer
        description: How many apps the list holds.
      - name: catalogue_date
        type: string
        description: The day the list of apps was taken, as YYYY-MM-DD.

  - id: apps.list
    summary: List every app available to install, and who made each
    example_phrases:
      - what apps are available
      - list all the apps
      - what apps can i install
      - show me the full list of apps
      - how many apps are in the store
      - browse the apps catalogue
      - what apps has this author made
    inputs:
      - name: author
        type: string
        required: false
        description: >-
          The author whose apps the user wants listed, if they named one, for
          example "Hackathon Demos". If they did not name an author, return an
          empty string rather than guessing.
    output:
      - name: count
        type: integer
        description: How many apps are listed.
      - name: apps
        type: array
        item_type: string
        description: >-
          Every app, or every app from the author named, as
          "<name>, from <author>", in alphabetical order.
      - name: catalogue_date
        type: string
        description: The day the list of apps was taken, as YYYY-MM-DD.
